spring:
  application:
    name: hesco-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hesco}
    username: ${DB_USERNAME:hesco}
    password: ${DB_PASSWORD:hesco}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.lmkr.hesco: INFO
