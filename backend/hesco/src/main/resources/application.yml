spring:
  application:
    name: hesco

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hesco_local}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: false
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8084}

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET}
    expiration-minutes: ${AUTH_JWT_EXPIRATION_MINUTES:60}
    issuer: hesco

  password:
    expiry-days: ${AUTH_PASSWORD_EXPIRY_DAYS:30}
    expiry-warning-days: ${AUTH_PASSWORD_EXPIRY_WARNING_DAYS:7}

logging:
  level:
    com.lmkr.hesco: INFO